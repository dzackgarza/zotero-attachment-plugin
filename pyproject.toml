[project]
name = "zotero-local-write-api-tests"
version = "0.0.0"
description = "Schemathesis contract and stateful proofs for the Zotero Local Write API."
requires-python = ">=3.11"
dependencies = [
    "schemathesis>=4.0,<5",
    "pytest>=8,<9",
    "hypothesis>=6,<7",
]

# Non-package test environment: there is nothing to build or install, only
# tests to run against a live Zotero instance.
[tool.uv]
package = false
# Dependency cooldown: ignore packages published after this date so a freshly
# compromised or broken release cannot enter a resolve. Bump periodically.
exclude-newer = "2026-08-06T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests/schemathesis"]
pythonpath = ["."]
